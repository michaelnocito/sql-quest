<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Quest — SQL Tower Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171513;--surf:#201d1a;--surf2:#292520;
  --accent:#58aaa2;--accent2:#7dbfb8;
  --text:#e8e0d4;--muted:#9a8f82;--border:#363028;
  --red:#e05c5c;--green:#5cba8a;--yellow:#d4a849;
  --font:'Hanken Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:10px;--r2:6px;--shadow:0 2px 12px rgba(0,0,0,.4);
}
.light{
  --bg:#ddd6c8;--surf:#ffffff;--surf2:#f0ece4;
  --text:#1a1714;--muted:#6b5f52;--border:#c8bfb0;
  --shadow:0 2px 12px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--accent);text-decoration:none}
code{font-family:var(--mono);background:var(--surf2);padding:1px 5px;border-radius:4px;font-size:.85em;color:var(--accent2)}

/* TOP BAR */
header{background:var(--surf);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap;position:relative}
header .hp-wrap{margin-right:4px}
header .dev-toggle{margin-left:2px}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand .q{color:var(--accent)}
.wave-chip{font-size:12px;color:var(--muted);background:var(--surf2);padding:3px 10px;border-radius:20px;white-space:nowrap}
.wave-chip b{color:var(--text)}
.spacer{flex:1}
.hp-wrap{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.hp-bar{width:90px;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.hp-fill{height:100%;width:100%;background:var(--green);border-radius:4px;transition:width .5s,background .5s}
.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);font:inherit;font-size:16px;width:32px;height:32px;border-radius:var(--r2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--text)}
.icon-btn.on{color:var(--accent);border-color:var(--accent)}
.icon-btn.off{opacity:.4}
/* Dev-only wave picker — only visible when DEV is on. */
.dev-jump{height:32px;background:var(--surf);color:var(--text);border:1px solid var(--border);border-radius:var(--r2);padding:0 8px;font:600 11px var(--mono);cursor:pointer;display:none}
.dev-jump:hover{border-color:var(--accent)}
.dev-jump:focus{outline:none;border-color:var(--accent)}
.dev-toggle{width:auto;padding:0 10px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.5px}
.dev-toggle::after{content:' OFF';opacity:.7}
.dev-toggle.on::after{content:' ON'}
/* CONCEPT TRACK — shows the whole campaign path: done · current · upcoming */
.track{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:3px}
.track-step{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:4px 10px 4px 5px;border-radius:20px;border:1px solid var(--border);background:var(--surf);color:var(--muted);white-space:nowrap}
.track-step .dot{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--surf2);color:var(--muted)}
.track-step.done{border-color:var(--green);color:var(--green)}
.track-step.done .dot{background:var(--green);color:#0e1f1e}
.track-step.current{border-color:var(--accent);color:var(--text);background:rgba(88,170,162,.12)}
.track-step.current .dot{background:var(--accent);color:#0e1f1e}
/* SCHEMA chips */
.schema-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.schema-tbl{font-family:var(--mono);font-size:11px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:5px 9px;color:var(--muted)}
.schema-tbl b{color:var(--accent2)}
/* EDITOR — wrap holds the surface + border; the textarea is TRANSPARENT so the
   grey ghost shows THROUGH where the player hasn't typed yet. As they type,
   their bright text overlays the grey at the corresponding positions — the
   "type over the vision" effect Mike wants for both DEV and Oracle's Vision. */
.ed-wrap{position:relative;background:#0d0d0d;border:2px solid #0a9;border-radius:var(--r2);transition:border-color .15s;box-shadow:inset 0 0 0 1px rgba(0,170,136,.2)}
.ed-wrap:focus-within{border-color:#00dd99;box-shadow:inset 0 0 0 1px rgba(0,221,153,.4)}
#editor{width:100%;min-height:156px;resize:vertical;font-family:var(--mono);font-size:15.5px;line-height:1.7;color:rgba(232,224,212,.85);background:transparent;border:0;border-radius:0;padding:14px 16px;outline:none;position:relative;z-index:2}
#editor::placeholder{color:rgba(154,143,130,.5);font-style:italic}
.ed-ghost{position:absolute;top:14px;left:16px;right:16px;font-family:var(--mono);font-size:15.5px;line-height:1.7;color:rgba(90,170,150,.7);pointer-events:none;white-space:pre-wrap;overflow:hidden;z-index:1}
.ed-ghost .token.keyword{color:#66d9ef;font-weight:600}
.ed-ghost .token.string{color:#e6db74}
.ed-ghost .token.number{color:#ae81ff}
.ed-ghost .token.function{color:#a1efe4}
.ed-ghost .token.operator{color:#f92672}
.ed-ghost .token.comment{color:#75715e;font-style:italic}
.ed-row{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r2);font:600 14px var(--font);cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#0e1f1e}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text)}
.btn-sm{padding:7px 13px;font-size:13px}
.kbd{font-family:var(--mono);font-size:10px;background:var(--surf2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
.btn.pulse{animation:hintpulse 1.6s ease-out 2}
@keyframes hintpulse{0%{box-shadow:0 0 0 0 rgba(212,168,73,.5);border-color:var(--yellow);color:var(--yellow)}70%{box-shadow:0 0 0 8px rgba(212,168,73,0)}100%{box-shadow:0 0 0 0 rgba(212,168,73,0)}}
.dev-note{font-size:11px;color:var(--muted)}
/* RESULT / FEEDBACK */
.feedback{margin-top:9px;font-size:13px;min-height:18px}
.feedback.ok{color:var(--green)}
.feedback.warn{color:var(--yellow)}
.feedback.err{color:var(--red)}
/* OUTPUT PANEL — labelled card so the result is a first-class element, not
   a hidden footnote. Mike: reading output is its own skill; show it like it matters. */
.output-block{margin-top:10px;background:var(--surf);border:1px solid var(--accent);border-radius:var(--r2);padding:9px 12px 11px;box-shadow:0 0 0 1px rgba(88,170,162,.08)}
.output-h{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
#result{max-height:240px;overflow:auto;margin-top:0}
.result-tbl{margin-top:6px;width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.result-tbl th{position:sticky;top:0}
.result-tbl th,.result-tbl td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.result-tbl th{background:var(--surf2);color:var(--accent2)}
.result-meta{margin-top:5px;font-size:11px;color:var(--muted)}
/* gauge cell — a threat/HP column rendered as a readable bar + value, so the
   battlefield can be read straight off the scan. */
.gauge-td{white-space:nowrap}
.gauge{display:inline-block;vertical-align:middle;width:46px;height:7px;border-radius:4px;background:var(--surf2);border:1px solid var(--border);overflow:hidden;margin-right:7px}
.gauge-bar{display:block;height:100%;border-radius:4px}
.gauge-val{vertical-align:middle;color:var(--text)}
/* BATTLEFIELD */
/* Two stacked SVG layers: #field-bg is built ONCE and holds the slow ambient
   psychedelic-celestial motion (so it never restarts on a turn redraw);
   #field is the gameplay layer, rebuilt each turn, transparent over the bg. */
#field-bg,#field{position:absolute;inset:0;width:100%;height:100%;display:block}
#field-bg{pointer-events:none;animation:bg-hue 44s ease-in-out infinite}
@keyframes bg-hue{0%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(20deg)}100%{filter:hue-rotate(0deg)}}
/* psychedelic-celestial ambient motion (CSS, runs persistently on #field-bg) */
.neb-a{animation:neb-drift-a 40s ease-in-out infinite}
.neb-b{animation:neb-drift-b 46s ease-in-out infinite}
@keyframes neb-drift-a{0%{transform:translate(0,0)}50%{transform:translate(70px,28px)}100%{transform:translate(0,0)}}
@keyframes neb-drift-b{0%{transform:translate(0,0)}50%{transform:translate(-66px,-26px)}100%{transform:translate(0,0)}}
.mandala{transform-box:view-box;transform-origin:400px 160px}
.mandala.spin{animation:spin-cw 140s linear infinite}
.mandala.spin-rev{animation:spin-ccw 110s linear infinite}
.mandala.spin-fast{animation:spin-cw 90s linear infinite}
@keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-ccw{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
.tw{animation-name:twinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes twinkle{0%,100%{opacity:var(--o,0.5)}50%{opacity:calc(var(--o,0.5)*0.25)}}
/* geometric "celestial being" character idle motion (hero + enemies) */
.spin-self{transform-box:fill-box;transform-origin:center}
.s-cw-28{animation:spin-cw 28s linear infinite}
.s-ccw-22{animation:spin-ccw 22s linear infinite}
.s-cw-16{animation:spin-cw 16s linear infinite}
.s-cw-9{animation:spin-cw 9s linear infinite}
.s-ccw-11{animation:spin-ccw 11s linear infinite}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){#field-bg,.neb-a,.neb-b,.mandala,.tw,.spin-self,.breathe{animation:none}}
.field-status{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
/* Course-complete screen — full-page overlay with stats + personal best */
#complete-screen{position:fixed;inset:0;background:rgba(23,21,19,.95);display:none;align-items:center;justify-content:center;z-index:50;overflow-y:auto;padding:20px}
#complete-screen.show{display:flex}
.cbox{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:28px 30px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.crank{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--yellow);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.ctitle{font-size:22px;font-weight:700;margin-bottom:3px}
.csub{font-size:13px;color:var(--muted);margin-bottom:22px}
.cstats{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.cs-row{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px}
.cs-label{font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;grid-column:1}
.cs-val{font-size:22px;font-weight:700;line-height:1;text-align:right}
.cs-sub{font-size:12px;font-weight:400;color:var(--muted)}
.cs-bar-wrap{grid-column:1/-1;background:var(--surf2);border-radius:3px;height:5px}
.cs-bar{height:5px;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.cpb{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;font-size:12px;background:var(--surf2);padding:9px 12px;border-radius:6px;margin-bottom:14px}
.cpb-lbl{font-weight:600;color:var(--muted);flex-basis:100%}
.cpb-val{color:var(--accent2)}
.cpb-sep{color:var(--border)}
.cgoal{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:4px}
.cvision{margin-bottom:14px;padding:10px 12px;background:var(--surf2);border:1px solid var(--border);border-radius:6px}
.cvision-lbl{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--accent2);margin-bottom:7px;font-weight:600}
.cvision-chips{display:flex;flex-wrap:wrap;gap:5px}
.cvision-chip{font-family:var(--mono);font-size:11px;background:var(--surf);border:1px solid var(--border);color:var(--yellow);padding:3px 8px;border-radius:4px}
.cvision-empty{font-size:13px;color:var(--green);text-align:center;font-weight:600}
.overlay{position:absolute;inset:0;background:rgba(23,21,19,.86);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:30;overflow-y:auto}
.overlay.show{display:flex}
.overlay h2{font-size:1.5rem;margin-bottom:6px}
.overlay p{color:var(--muted);margin-bottom:16px;max-width:340px}
.ov-btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}
.overlay .big{font-size:2.4rem;margin-bottom:8px}
.first-try{font-size:13px;font-weight:700;color:#0e1f1e;background:var(--yellow);padding:3px 12px;border-radius:20px;margin-bottom:12px;display:none}
.first-try.show{display:inline-block}
.terms-wrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px;max-width:360px}
.term-chip{font-family:var(--mono);font-size:11px;background:var(--surf2);border:1px solid var(--accent);color:var(--accent2);padding:3px 10px;border-radius:20px}
.terms-label{font-size:11px;color:var(--muted);width:100%;margin-bottom:2px}

/* TOAST + CONFETTI */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surf);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:24px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:200;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:190;overflow:hidden}
.confetti{position:absolute;top:-12px;width:9px;height:9px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
/* IMPACT FX (SVG) */
.boom{transform-box:fill-box;transform-origin:center;pointer-events:none}
.boom-flash{animation:boom-flash .32s ease-out forwards}
.boom-ring{animation:boom-ring .42s ease-out forwards}
.boom-shard{animation:boom-shard .5s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes boom-flash{0%{transform:scale(.35);opacity:1}100%{transform:scale(2.3);opacity:0}}
@keyframes boom-ring{0%{transform:scale(.25);opacity:.95}100%{transform:scale(3);opacity:0}}
@keyframes boom-shard{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.enemy.hit{animation:enemy-die .26s ease-in forwards}
@keyframes enemy-die{0%{opacity:.92}100%{opacity:0;transform:scale(.2)}}
.enemy{transform-box:fill-box;transform-origin:center}
.enemy.flash .mote-core{animation:enemy-flash .3s ease-out}
@keyframes enemy-flash{0%{fill:#fff}55%{fill:var(--red)}100%{fill:#160f1e}}
.dmgnum{font-family:var(--mono);font-size:13px;font-weight:700;pointer-events:none;animation:dmgfloat .8s ease-out forwards}
.dmg-hit{fill:#ffd9a0}
.dmg-ff{fill:var(--red)}
@keyframes dmgfloat{0%{opacity:0;transform:translateY(5px)}20%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
/* enemy turn: a wrong command lets the swarm strike back */
.enemy.lunge{animation:enemy-lunge .34s ease-in-out}
@keyframes enemy-lunge{0%{transform:translateX(0)}45%{transform:translateX(20px)}100%{transform:translateX(0)}}
.enemy-bolt{pointer-events:none;animation:bolt-fade .26s linear forwards}
@keyframes bolt-fade{0%{opacity:.95}100%{opacity:0}}
.base-core{transform-box:fill-box;transform-origin:center}
.base-core.base-hit{animation:base-hit .34s ease-out}
@keyframes base-hit{0%{fill:#fff}40%{fill:var(--red)}100%{fill:var(--accent)}}
/* charged strike: a foe winds up over repeated misses. A pulsing warning ring
   telegraphs the heavy hit; one correct query interrupts it (see volley). */
.charge-warn{transform-box:fill-box;transform-origin:center;animation:charge-pulse .9s ease-in-out infinite}
@keyframes charge-pulse{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.28);opacity:.95}}
.charge-bolt{pointer-events:none;animation:bolt-fade .3s linear forwards}
.base-core.base-hit-heavy{animation:base-hit-heavy .5s ease-out}
@keyframes base-hit-heavy{0%{fill:#fff;transform:scale(1.5)}45%{fill:var(--red)}100%{fill:var(--accent);transform:scale(1)}}
.dmg-charged{fill:#ffb648;font-size:17px}
.dmg-perfect{fill:#ffd95c;font-size:22px;font-weight:800;filter:drop-shadow(0 0 6px rgba(255,217,92,.6))}
/* Layered-attack VFX — escalates per attackTier(). */
.shockwave{animation:shock-expand .7s ease-out forwards;transform-origin:center;transform-box:fill-box}
@keyframes shock-expand{0%{r:6;opacity:.9;stroke-width:2.5}100%{r:46;opacity:0;stroke-width:.6}}
.base-core.volley-pulse{animation:volley-pulse .62s ease-out}
@keyframes volley-pulse{0%{filter:drop-shadow(0 0 0 rgba(125,191,184,0));transform:scale(1)}45%{filter:drop-shadow(0 0 14px rgba(125,191,184,.85));transform:scale(1.18)}100%{filter:drop-shadow(0 0 0 rgba(125,191,184,0));transform:scale(1)}}
/* Oracle charge — persistent visual escalation per wrong attempt. The class
   lives on .field-pane (not #oracle) because drawField() rebuilds the SVG
   between turns; the parent class survives the rebuild. */
.field-pane.charge-1 #oracle{filter:drop-shadow(0 0 8px rgba(125,191,184,.55))}
.field-pane.charge-2 #oracle{filter:drop-shadow(0 0 14px rgba(125,191,184,.75)) drop-shadow(0 0 26px rgba(125,191,184,.35))}
.field-pane.charge-3 #oracle{animation:oracle-charge-3 1.8s ease-in-out infinite}
@keyframes oracle-charge-3{
  0%,100%{filter:drop-shadow(0 0 18px rgba(212,168,73,.7)) drop-shadow(0 0 8px rgba(125,191,184,.5))}
  50%{filter:drop-shadow(0 0 32px rgba(212,168,73,1)) drop-shadow(0 0 50px rgba(125,191,184,.4))}
}
/* Screen shake + damage flash — wrong-answer juice */
.screen-shake{animation:screen-shake .25s ease-out}
@keyframes screen-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,-3px)}40%{transform:translate(5px,3px)}60%{transform:translate(-3px,5px)}80%{transform:translate(3px,-5px)}}
.damage-flash{position:fixed;inset:0;background:rgba(224,92,92,.35);pointer-events:none;z-index:999;animation:dmg-flash-fade .35s ease-out forwards}
@keyframes dmg-flash-fade{0%{opacity:1}100%{opacity:0}}
.success-flash{position:fixed;inset:0;background:rgba(92,186,138,.2);pointer-events:none;z-index:999;animation:suc-flash-fade .4s ease-out forwards}
@keyframes suc-flash-fade{0%{opacity:1}100%{opacity:0}}
/* Phase mechanic: shielded enemies in phase-1 show a pulsing teal ring */
.shield-ring{animation:shield-pulse 1.6s ease-in-out infinite}
@keyframes shield-pulse{0%,100%{stroke-opacity:0.3;stroke-width:2}50%{stroke-opacity:0.85;stroke-width:3.5}}
/* Phase indicator chip in the briefing */
.phase-chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--yellow);background:var(--surf2);border:1px solid rgba(212,168,73,.45);padding:2px 9px;border-radius:4px;margin-top:6px;gap:5px}
/* Reactive whole-Oracle keystroke glow is driven by the Web Animations API
   (see the editor `input` handler) — CSS class-toggle restart fails on SVG
   elements because they don't expose offsetWidth, so we can't force a reflow. */

/* BREAK NUDGE */
.break-nudge{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--accent);padding:12px 16px;display:none;align-items:center;gap:12px;z-index:180;font-size:13px}
.break-nudge.show{display:flex}
.break-nudge .x{margin-left:auto}
/* === SUB-DESKTOP BREAKPOINT (<900px): collapse the settings menu + tighten
   the briefing. This covers desktop-narrow windows AND real phones — the
   header just doesn't have room for 8 buttons regardless of device. === */
.more-group{display:contents}
#more-btn{display:none}
@media (max-width:899px){
  #more-btn{display:flex}

<body>

<header>
  <div class="brand">SQL <span class="q">Quest</span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="music-btn" title="Background music on/off" onclick="toggleMusic()">🎵</button>
  <button class="icon-btn" id="sfx-btn" title="Sound effects on/off" onclick="toggleSfx()">🔔</button>
  <button class="icon-btn" id="melody-btn" title="Code-as-melody: typing tones + keyword chimes + execute chord (opt-in; requires SFX on)" onclick="toggleMelody()">🎼</button>
  <button class="icon-btn" id="more-btn" title="More settings" aria-label="More settings" aria-expanded="false" onclick="toggleMore()">⚙</button>
  <div class="more-group" id="more-group">
    <button class="icon-btn dev-toggle" id="dev-btn" title="Dev mode — ON: Tab inserts the answer, wave jump unlocked." onclick="toggleDev()">DEV</button>
    <select class="dev-jump" id="dev-jump" aria-label="Jump to wave (dev mode)" title="Jump to any wave (dev)" onchange="jumpToWave(this.value)"></select>
    <button class="icon-btn" id="theme-btn" title="Theme" onclick="toggleTheme()">◐</button>
    <button class="icon-btn" id="reset-btn" title="Reset all campaign progress" onclick="confirmReset()">↻</button>
  </div>
</header>

<main class="appmain">
  <div id="app"><p style="text-align:center;color:var(--muted);padding:40px 0">Warming the drives…</p></div>
</main>

<div id="toast"></div>
<div id="confetti"></div>
<div id="complete-screen"></div>
<div class="break-nudge" id="break-nudge">
  <span>🧠 You've been locked in a while. A 5–10 min break now keeps your focus sharp — that's how analysts last a full day.</span>
  <button class="btn btn-ghost btn-sm x" onclick="dismissBreak()">Got it</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/components/prism-sql.min.js"></script>
<script src="waves.js"></script>
<script>
/* ─── STATE ──────────────────────────────────────────────────────────────── */
const LS = 'sqlquest';
// Stamped at build time (Eastern, 12-hour). Update on each build.
const BUILD_TS = "July 20, 2026 · 2:45 PM ET";
const state = {
  wave: 0, phase: 0, baseHP: 100, devMode: false, music: false, sfx: true, melody: false, theme: 'dark',
  cleared: [], attempts: 0, correct: 0, fatalities: 0, visionWaves: [], streak: 0,
  started: Date.now(), screen: 'title', begun: false
};
let SQLjs = null;          // initSqlJs module
let enemiesLive = [];      // live battlefield enemies for current wave
let busy = false;          // lock during animations
let waveTries = 0;         // misses this wave — drives the Trail-style escalating help
let handedOver = false;    // 3rd miss: the full solution is in the editor
let waveFriction = false;  // ANY miss this wave — disqualifies a FATALITY
const HAND_OVER_AT = 3;    // misses before the full solution is handed over

function load(){
  try{ Object.assign(state, JSON.parse(localStorage.getItem(LS)) || {}); }catch(e){}
  const saved = (()=>{ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } })();
  if(saved.music === undefined && saved.audio !== undefined) state.music = saved.audio;
  if(saved.sfx === undefined && saved.audio !== undefined) state.sfx = saved.audio;
  state.started = Date.now();
  state.screen = 'title';
}
function save(){
  localStorage.setItem(LS, JSON.stringify({
    wave: state.wave, baseHP: state.baseHP, devMode: state.devMode,
    music: state.music, sfx: state.sfx, melody: state.melody, theme: state.theme, cleared: state.cleared,
    attempts: state.attempts, correct: state.correct, streak: state.streak || 0,
    fatalities: state.fatalities || 0, visionWaves: state.visionWaves || [], begun: !!state.begun
  }));
}
function currentWave(){ return WAVES[state.wave]; }
function currentPhaseSolution(){
  const w = currentWave();
  return (w.phases && w.phases[state.phase]) ? w.phases[state.phase].solution : w.solution;
}
function accuracy(){ return state.attempts ? Math.round(100*state.correct/state.attempts) : 100; }
/* ════════════════════════════════════════════════════════════════════════════
   LANGUAGE MODULE — replace this entire region to clone the game.
   Everything else (combat, audio, UI, animation, wave engine) is shared.

   To port to Python / Excel / Tableau, swap these 7 surfaces:
     1. bootSQL() / freshDB() / execQuery() — load language runtime, exec code
     2. sameResult(a, b, ordered)            — compare player result to expected
     3. falsePositives(player, expected)     — count over-broad rows (FF damage)
     4. solutionIsOrdered(solution)          — does solution care about order?
     5. isSafe(code)                         — security allowlist
     6. attackTier(code)                     — 1-5 complexity → VFX/audio depth
     7. SQL_KEYWORDS / KEYWORD_TONES / formatSQL() — keyword list, melody map
   Search this file for `LANGUAGE MODULE` to find every block.
   ════════════════════════════════════════════════════════════════════════════ */
/* ─── LANGUAGE MODULE: SQL ENGINE ────────────────────────────────────────── */
async function bootSQL(){
  SQLjs = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
}
function freshDB(schema){
  const db = new SQLjs.Database();
  db.run(schema);
  return db;
}
// Run a query, return {columns, rows} or throw.
function execQuery(db, sql){
  const res = db.exec(sql);
  if(!res.length) return { columns: [], rows: [] };
  return { columns: res[0].columns, rows: res[0].values };
}
// Result-set comparison. Order-insensitive by default; when `ordered` is true
// (the wave's solution uses ORDER BY), row order must match too — so sorting
// waves are actually testable.
function sameResult(a, b, ordered){
  if(a.columns.length !== b.columns.length) return false;
  if(a.rows.length !== b.rows.length) return false;
  const seq = rows => rows.map(row => JSON.stringify(row));
  let na = seq(a.rows), nb = seq(b.rows);
  if(!ordered){ na = na.slice().sort(); nb = nb.slice().sort(); }
  return na.every((v,i) => v === nb[i]);
}

// Rows the player returned that aren't in the solution set = over-broad "stray"
// rows. Drives friendly-fire damage. Column-set mismatch counts every row as stray.
function falsePositives(player, expected){
  const exp = new Set(expected.rows.map(r => JSON.stringify(r)));
  let extra = 0;
  player.rows.forEach(r => { if(!exp.has(JSON.stringify(r))) extra++; });
  return extra;
}

/* Does the solution require row order to match? (SQL: any ORDER BY clause.)
   Used by runQuery() when comparing player output to expected. */
function solutionIsOrdered(solution){
  return /\border\s+by\b/i.test(solution || '');
}

/* Security: allow only read-only query verbs. */
function isSafe(sql){
  const banned = /\b(DROP|DELETE|UPDATE|INSERT|ALTER|CREATE|REPLACE|ATTACH|DETACH|PRAGMA|VACUUM)\b/i;
  return !banned.test(sql);
}
/* ─── END LANGUAGE MODULE: SQL ENGINE ────────────────────────────────────── */

function esc(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ─── VOICE — wry, warm, second-person; SQL punned against the fiction ───── */
const WIN_BANNERS = ['DIRECT HIT!', 'LANE CLEARED!', 'SWARM SCATTERED!', 'CLEAN SWEEP!', 'TARGETS DOWN!', 'SECTOR SECURED!'];
const FATALITY_BANNER = 'FATALITY!';
const WIN_LINES = [
  'The bridge crew breaks into zero-gravity applause.',
  'The quartermaster tears up over a perfectly filtered manifest.',
  'Somewhere in the engine room, a mechanic hums the SELECT you just wrote.',
  'The nav computer prints your query and pins it to its corkboard.',
  'Even the nebula seems to swirl a little prouder.',
  'The Captain nods once. From her, that is a parade.',
  'Sensor room reports the swarm filing a formal complaint.',
  'That query landed like a docking clamp — first try, dead center.',
  'The coffee synthesizer dispenses a celebratory double shot.',
];
const MISS_LINES = [
  'The query went port, the swarm went starboard. Reunite them.',
  'The targeting computer squinted at that one. Adjust and refire.',
  'Bold shot, Chief — wrong constellation entirely.',
  'The swarm is being awfully polite about that volley.',
  'Close enough to rattle their hulls, not to crack them.',
  'Your WHERE wandered off into open space. Round it up.',
  'The nav computer coughed politely and looked away.',
  'Wrong lock, right spirit. Line it up again.',
  'That one grazed a comet. The comet is fine. The swarm is too.',
];
/* ─── LANGUAGE MODULE: KEYWORDS + FORMAT BUTTON ──────────────────────────── */
/* SQL keywords we recognise in our wave set. Used by formatSQL() to uppercase
   them in place — pure presentation, the engine accepts any case.
   Also feeds the code-as-melody keyword chime (see KEYWORD_TONES). */
const SQL_KEYWORDS = [
  'SELECT','FROM','WHERE','AND','OR','NOT','IN','BETWEEN','LIKE','IS','NULL',
  'ORDER','BY','ASC','DESC','LIMIT','OFFSET','GROUP','HAVING','AS','DISTINCT',
  'JOIN','ON','LEFT','RIGHT','INNER','OUTER','FULL','CROSS','UNION','ALL',
  'COUNT','SUM','AVG','MIN','MAX','CASE','WHEN','THEN','ELSE','END','EXISTS','WITH'
];
function formatSQL(){
  const ed = document.getElementById('editor');
  if(!ed || !ed.value) return;
  // Split on quoted string literals so we don't mangle data values like
  // 'Raider' — odd-indexed segments are the strings and stay untouched.
  const parts = ed.value.split(/('(?:[^']|'')*')/g);
  for(let i = 0; i < parts.length; i += 2){
    let seg = parts[i];
    SQL_KEYWORDS.forEach(kw => {
      seg = seg.replace(new RegExp(`\\b${kw}\\b`, 'gi'), kw);
    });
    parts[i] = seg;
  }
  ed.value = parts.join('');
  // Pure presentation — the engine accepts any case.
  syncGhost();
}
/* ─── END LANGUAGE MODULE: KEYWORDS + FORMAT BUTTON ──────────────────────── */
// queries one, we render it as a readable gauge bar so the battlefield is
// legible straight from the table ("scan the threat, then calibrate"). Pure
// presentation: the data, query and combat are untouched.
const GAUGE_COLS = ['threat_level','threat','hp','health','strength','power','shield','armor','danger'];
function gaugeColIndex(columns){
  return columns.findIndex(c => GAUGE_COLS.includes(String(c).toLowerCase()));
}
function gaugeCell(v, max){
  if(v == null || isNaN(Number(v))) return `<td>${v==null?'NULL':esc(v)}</td>`;
  const n = Number(v);
  const pct = max > 0 ? Math.max(6, Math.round((n / max) * 100)) : 0;
  // colour by relative strength: high = red threat, mid = yellow, low = green
  const ratio = max > 0 ? n / max : 0;
  const col = ratio > 0.66 ? 'var(--red)' : ratio > 0.33 ? 'var(--yellow)' : 'var(--green)';
  return `<td class="gauge-td"><span class="gauge"><span class="gauge-bar" style="width:${pct}%;background:${col}"></span></span><span class="gauge-val">${esc(v)}</span></td>`;
}
/* ─── BATTLEFIELD (SVG) ──────────────────────────────────────────────────── */
const FIELD_W = 800, FIELD_H = 320;
// Legacy lane geometry — still referenced by a couple of helpers (laneY/enemyX).
const BASE_X = 720, LANE_TOP = 50, LANE_GAP = 56;
// First-person helm: with the Oracle removed, YOU fire from the bottom-centre of
// the view and enemy hits register there too. (Replaced the old Oracle origin.)
const HELM_X = FIELD_W / 2, HELM_Y = FIELD_H - 8;
// Bearing-based enemy positions — spread across the viewport like space around you.
// Each enemy at a different angle (bearing) from the center, distance scaled by advancement.
// Waves can override via optional `positions` array: [{x, y}, ...] in wave data.
function enemyPos(i, en){
  const N = enemiesLive.length;
  const w = state.wave < WAVES.length ? WAVES[state.wave] : null;

  // If the wave defines explicit positions, use them (data-driven per scenario).
  if(w && w.positions && w.positions[i]) return w.positions[i];

  // Otherwise, spread enemies in a bearing formation across the viewport.
  const cx = FIELD_W / 2, cy = FIELD_H / 2;
  const bearing = (i / Math.max(1, N)) * Math.PI * 2;  // evenly space around circle
  const advDist = 90 + en.advance * 0.8;  // distance from center based on advancement
  const x = cx + Math.cos(bearing) * advDist;
  const y = cy + Math.sin(bearing) * advDist * (FIELD_H / FIELD_W);  // scale for aspect
  return { x: Math.max(40, Math.min(FIELD_W - 40, x)), y: Math.max(40, Math.min(FIELD_H - 40, y)) };
}
const ENEMY_MAXHP = 100;   // every enemy starts here; a correct volley chips maxHp/rounds
const FF_DMG = 4;          // friendly-fire: base HP lost per over-broad (false-positive) row
// (creep mechanic removed — FF-style combat now: enemies hold their squadron on the left, the Oracle on the right, animations travel between)
function laneY(i){ return LANE_TOP + i * LANE_GAP; }
function waveRounds(){ const r = currentWave().rounds; return (r && r > 0) ? r : 3; }
// waveCreep() removed with the creep mechanic; `creep` field in waves.js is now ignored data.
function correctHit(){ return Math.ceil(ENEMY_MAXHP / waveRounds()); }
/* Layered attack: derive a tier (1–5) from how many operative SQL clauses
   the wave's solution uses. Each new concept layer = a richer volley VFX.
   Tier 1 = SELECT only; +1 for WHERE; +1 for AND/OR/IN/BETWEEN/LIKE/NOT;
   +1 for ORDER BY / LIMIT; +1 for JOIN; +1 for aggregates / GROUP BY / HAVING. */
/* ─── LANGUAGE MODULE: COMPLEXITY TIER (1-5) ─────────────────────────────── */
function attackTier(sql){
  const s = (sql || '').toUpperCase();
  let t = 1;
  if(/\bWHERE\b/.test(s)) t++;
  if(/\b(AND|OR|NOT|IN|BETWEEN|LIKE)\b/.test(s)) t++;
  if(/\b(ORDER\s+BY|LIMIT)\b/.test(s)) t++;
  if(/\bJOIN\b/.test(s)) t++;
  if(/\b(COUNT|SUM|AVG|MIN|MAX)\s*\(/.test(s) || /\b(GROUP\s+BY|HAVING)\b/.test(s)) t++;
  return Math.min(t, 5);
}
/* ─── END LANGUAGE MODULE: COMPLEXITY TIER ───────────────────────────────── */
/* Expanding ring at the impact point — used on tier ≥ 4 volleys and on
   every fatality detonation. CSS keyframe `shock-expand` handles the grow+fade. */
function spawnShockwave(svg, x, y, color){
  const r = document.createElementNS(SVGNS,'circle');
  r.setAttribute('cx', x); r.setAttribute('cy', y); r.setAttribute('r', '6');
  r.setAttribute('fill', 'none');
  r.setAttribute('stroke', color || 'var(--accent2)');
  r.setAttribute('stroke-width', '2.5');
  r.setAttribute('class', 'shockwave');
  svg.appendChild(r);
  setTimeout(()=> r.remove(), 720);
}
// Will the frontmost foe's next counterattack be a heavy charged strike?
function impendingStrike(){
  const living = enemiesLive.filter(e=>e.alive);
  if(!living.length) return false;
  const atk = living.reduce((a,b)=> b.advance > a.advance ? b : a);
  const a = archOf(atk);
  return a.charge > 0 && ((atk.charge||0)+1) >= a.charge;
}
function enemyX(adv){ return 210 + adv * (BASE_X - 280) / 4; } // 4 steps to reach base; shifted right to fit wider doubled-size squadrons

// Celestial Cartographer theme: the field is a window into a twilight sky.
// Star positions are generated once so they stay put across the frequent
// redraws (no flicker). Stars = data points; you weave them into constellations.
const STARS = Array.from({length: 70}, ()=>({
  x: Math.random()*800, y: Math.random()*320,
  r: +(Math.random()*1.2 + 0.3).toFixed(2), o: +(Math.random()*0.55 + 0.2).toFixed(2),
  tw: +(Math.random()*6 + 4).toFixed(1)   // twinkle period (s)
}));
// Gameplay-layer gradients only (the animated sky/nebula live in #field-bg).
function fieldDefs(){
  return `<defs>`
    + `<radialGradient id="haloRaider" cx="0.5" cy="0.5" r="0.5">`
    +   `<stop offset="0" stop-color="rgba(224,92,92,0.42)"/><stop offset="1" stop-color="rgba(224,92,92,0)"/>`

/* Persistent psychedelic-celestial backdrop — built ONCE so its slow SMIL
   motion (drifting nebulae, a rotating sacred-geometry mandala, twinkling
   stars, a slow hue drift) runs uninterrupted. Everything is slow + low-
   contrast on purpose: art-first, hypnotic, low cognitive load. */
function buildFieldBg(){
  const bg = document.getElementById('field-bg');
  if(!bg || bg.dataset.built) return;
  const cx = 400, cy = 160;
  // mandala — concentric rings + radial spokes + a rotating polygon, faint
  let spokes = '';
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    spokes += `<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*300).toFixed(1)}" y2="${(cy+Math.sin(a)*300).toFixed(1)}" stroke="rgba(150,190,255,0.05)" stroke-width="1"/>`;
  }
  let rings = '';
  [40,80,120,170,230].forEach(r=>{ rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(130,200,210,0.06)" stroke-width="1"/>`; });
  const hexPts = Array.from({length:6},(_,i)=>{ const a=(i/6)*Math.PI*2; return `${(cx+Math.cos(a)*150).toFixed(1)},${(cy+Math.sin(a)*150).toFixed(1)}`; }).join(' ');
  const triPts = Array.from({length:3},(_,i)=>{ const a=(i/3)*Math.PI*2 - Math.PI/2; return `${(cx+Math.cos(a)*110).toFixed(1)},${(cy+Math.sin(a)*110).toFixed(1)}`; }).join(' ');
  let stars = '';
  STARS.forEach(st=>{
    stars += `<circle class="tw" cx="${st.x.toFixed(1)}" cy="${st.y.toFixed(1)}" r="${st.r}" fill="#dfe8ff" opacity="${st.o}" style="--o:${st.o};animation-duration:${st.tw}s;animation-delay:-${(st.tw*Math.random()).toFixed(1)}s"/>`;
  });
  bg.innerHTML = `<defs>`
    + `<linearGradient id="bgsky" x1="0" y1="0" x2="0" y2="1">`
    +   `<stop offset="0" stop-color="#0b1130"/><stop offset="0.55" stop-color="#101d38"/><stop offset="1" stop-color="#0e2a2c"/>`
    + `</linearGradient>`
    + `<radialGradient id="bgneb" cx="0.5" cy="0.5" r="0.5">`
    +   `<stop offset="0" stop-color="rgba(124,191,184,0.20)"/><stop offset="0.5" stop-color="rgba(120,110,200,0.10)"/><stop offset="1" stop-color="rgba(124,191,184,0)"/>`
    + `</radialGradient>`
    + `<radialGradient id="bgneb2" cx="0.5" cy="0.5" r="0.5">`
    +   `<stop offset="0" stop-color="rgba(168,120,210,0.16)"/><stop offset="1" stop-color="rgba(168,120,210,0)"/>`
    + `</radialGradient>`
    + `</defs>`
    + `<rect x="0" y="0" width="800" height="320" fill="url(#bgsky)"/>`
    // drifting nebula blobs (slow position drift, CSS)
    + `<ellipse class="neb-a" cx="240" cy="95" rx="360" ry="200" fill="url(#bgneb)"/>`
    + `<ellipse class="neb-b" cx="580" cy="230" rx="300" ry="170" fill="url(#bgneb2)"/>`
    + stars
    // rotating sacred-geometry mandala (very faint, slow, hypnotic)
    + `<g opacity="0.9">`
    +   `<g class="mandala spin">${rings}${spokes}</g>`
    +   `<polygon class="mandala spin-rev" points="${hexPts}" fill="none" stroke="rgba(125,191,184,0.10)" stroke-width="1"/>`
    +   `<polygon class="mandala spin-fast" points="${triPts}" fill="none" stroke="rgba(168,120,210,0.12)" stroke-width="1"/>`
    + `</g>`;
  bg.dataset.built = '1';
}
function drawField(){
  const svg = document.getElementById('field');
  buildFieldBg();   // ensure the persistent animated backdrop exists
  let s = fieldDefs();
  // Oracle removed — full viewport now shows space around you.
  // enemies spread across bearings around the player
  enemiesLive.forEach((en,i)=>{
    if(!en.alive) return;
    const { x, y } = enemyPos(i, en);
    const frac = Math.max(0, en.hp) / en.maxHp;
    const barW = 48, barH = 5, barX = x - barW/2, barY = y - 66;
    const hpCol = frac > 0.5 ? 'var(--green)' : frac > 0.25 ? 'var(--yellow)' : 'var(--red)';
    s += `<g class="enemy" data-i="${i}">`
      + enemyFigure(x, y, en)

      + `<rect x="${barX}" y="${barY}" width="${barW}" height="${barH}" rx="2" fill="var(--surf2)" stroke="var(--border)" stroke-width="0.5"/>`
      + `<rect x="${barX}" y="${barY}" width="${(barW*frac).toFixed(1)}" height="${barH}" rx="2" fill="${hpCol}"/>`
      + `</g>`;

  svg.innerHTML = s;

// ── geometric character forms (psychedelic-celestial) ──────────────────────
function polyPts(cx, cy, n, r, rot){
  let p = [];
  for(let i=0;i<n;i++){ const a = (rot||0) + i/n*Math.PI*2; p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1)); }
  return p.join(' ');
}
function starPts(cx, cy, spikes, ro, ri){
  let p = [];
  for(let i=0;i<spikes*2;i++){ const a = -Math.PI/2 + i/(spikes*2)*Math.PI*2; const r = (i%2)?ri:ro; p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1)); }
  return p.join(' ');
}
// The Oracle — a radiant geometric figure: pulsing aura, slow-rotating
// starburst halo, counter-rotating orbit ring, inner hexagon + glowing core.

function heroFigure(hx, hy){

  let nodes = '';
  for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; nodes += `<circle cx="${(hx+Math.cos(a)*71).toFixed(1)}" cy="${(hy+Math.sin(a)*71).toFixed(1)}" r="5" fill="var(--accent2)"/>`; }
  return `<g id="oracle">`
    + `<ellipse class="breathe" cx="${hx}" cy="${hy}" rx="109" ry="146" fill="url(#spireGlow)"/>`
    + `<g class="spin-self s-cw-28"><polygon points="${starPts(hx,hy,6,93,41)}" fill="none" stroke="var(--accent)" stroke-opacity="0.55" stroke-width="2.2"/>${spokes}</g>`
    + `<g class="spin-self s-ccw-22"><circle cx="${hx}" cy="${hy}" r="71" fill="none" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="1.5"/>${nodes}</g>`
    + `<polygon points="${polyPts(hx,hy,6,36,Math.PI/6)}" fill="var(--surf2)" stroke="var(--accent)" stroke-width="2.8"/>`
    + `<circle id="base-core" class="base-core" cx="${hx}" cy="${hy}" r="26" fill="var(--accent)"/>`
    + `<polygon points="${polyPts(hx,hy-1,3,15,-Math.PI/2)}" fill="var(--bg)" fill-opacity="0.55"/>`
    + `<text x="${hx}" y="${FIELD_H-4}" fill="var(--muted)" font-size="14" text-anchor="middle" font-family="var(--mono)">ORACLE</text>`

// Void-being archetypes — each wave's foes get a distinct silhouette so the
// player reads the threat at a glance. Scouts are nimble 3-point shards,
// Raiders are 5-point red stars, Wardens are heavy 6-point violet crystals.
// All keep class "mote-core" + fill "#160f1e" so the hit-flash keyframe works.
// Combat behavior, by archetype:
//   hit      — base counterattack damage on a wrong query
//   charge   — consecutive wrong queries needed to unleash a heavy strike
//              (0 = never charges; the foe stays pure light chip damage)
//   charged  — the heavy-strike damage when a wind-up completes
// A correct query always interrupts a wind-up (see volley), so good play is safe.
const ENEMY_ARCH = {
  scout:  { spikes:3, ro:36, ri:17, glyph:3, stroke:'#7fdfff', nucleus:'#9fe8ff', halo:'haloScout',  spin:'s-cw-9',  inner:'s-ccw-11', hit:4, charge:0, charged:0 },
  raider: { spikes:5, ro:43, ri:19, glyph:5, stroke:'var(--red)', nucleus:'var(--red)', halo:'haloRaider', spin:'s-cw-16', inner:'s-ccw-11', hit:6, charge:2, charged:13 },
  warden: { spikes:6, ro:44, ri:24, glyph:3, stroke:'#c79bff', nucleus:'#c79bff', halo:'haloWarden', spin:'s-cw-28', inner:'s-ccw-11', hit:8, charge:2, charged:18 }
};
function archOf(en){ return ENEMY_ARCH[en && en.archetype] || ENEMY_ARCH.warden; }
// Per-row archetype mapping: lets a single lane render a mix of silhouettes
// when the result set has a `type` column (Raider/Warden/Scout/etc.).
const TYPE_TO_ARCH = { 'Raider':'raider', 'Warden':'warden', 'Scout':'scout' };
function archFromType(t){ return TYPE_TO_ARCH[t] || null; }
const SHIP_SPRITES = { scout:'enemies/enemy_7.png', raider:'enemies/enemy_51.png', warden:'enemies/enemy_84.png' };
const SHIP_SPRITES_ALT = { scout:'enemies/enemy_23.png', raider:'enemies/enemy_112.png', warden:'enemies/enemy_51.png' };
function shipSpriteFor(en){
  const arch = en && en.archetype || 'warden';
  return (en && en.spriteAlt) ? (SHIP_SPRITES_ALT[arch] || SHIP_SPRITES[arch]) : (SHIP_SPRITES[arch] || 'enemies/enemy_84.png');
}
function enemyFigure(x, y, en){
  const a = archOf(en);
  const warn = (en && en.primed)
    ? `<circle class="charge-warn" cx="${x}" cy="${y}" r="56" fill="none" stroke="var(--yellow)" stroke-width="3"/>`
      + `<text x="${x}" y="${y-63}" fill="var(--yellow)" font-size="22" text-anchor="middle">⚡</text>`
    : '';
  const shield = (en && en.shielded)
    ? `<circle class="shield-ring" cx="${x}" cy="${y}" r="${a.ro + 22}" fill="none" stroke="var(--accent2)" stroke-width="2.5"/>`
    : '';
  const label = (en.archetype || '').charAt(0).toUpperCase() + (en.archetype || '').slice(1);
  const sz = 80;
  return `<circle cx="${x}" cy="${y}" r="56" fill="url(#${a.halo})"/>`
    + warn
    + shield
    + `<image href="${shipSpriteFor(en)}" x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}" class="mote-core" style="filter:drop-shadow(0 0 8px ${a.stroke})"/>`
    + `<text x="${x}" y="${y+63}" fill="#cdd6ff" font-size="13" text-anchor="middle" font-family="var(--mono)">${label}</text>`;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function spawnBoom(svg, x, y){
  const g = document.createElementNS(SVGNS,'g');
  const ring = document.createElementNS(SVGNS,'circle');
  ring.setAttribute('cx',x); ring.setAttribute('cy',y); ring.setAttribute('r',16);
  ring.setAttribute('fill','none'); ring.setAttribute('stroke','var(--yellow)'); ring.setAttribute('stroke-width','3');
  ring.setAttribute('class','boom boom-ring');
  const flash = document.createElementNS(SVGNS,'circle');
  flash.setAttribute('cx',x); flash.setAttribute('cy',y); flash.setAttribute('r',15);
  flash.setAttribute('fill','#ffd9a0'); flash.setAttribute('class','boom boom-flash');
  g.appendChild(ring); g.appendChild(flash);
  const N = 7;
  for(let k=0;k<N;k++){
    const a = (Math.PI*2*k)/N + Math.random()*0.5;
    const dist = 22 + Math.random()*18;
    const sh = document.createElementNS(SVGNS,'circle');
    sh.setAttribute('cx',x); sh.setAttribute('cy',y); sh.setAttribute('r',(2 + Math.random()*1.6).toFixed(1));
    sh.setAttribute('fill', k%2 ? 'var(--red)' : 'var(--accent2)');
    sh.setAttribute('class','boom boom-shard');
    sh.style.setProperty('--dx', (Math.cos(a)*dist).toFixed(1)+'px');
    sh.style.setProperty('--dy', (Math.sin(a)*dist).toFixed(1)+'px');
    g.appendChild(sh);
  }
  svg.appendChild(g);
  setTimeout(()=>g.remove(), 620);
}

// Floating number above a point (damage / friendly-fire).
function spawnDmg(svg, x, y, text, cls){

  t.setAttribute('x', x); t.setAttribute('y', y - 18);
  t.setAttribute('text-anchor','middle');

// (creepEnemies removed — FF-style stationary combat. en.advance stays at 0
//  for the life of the wave; enemyX() returns the fixed squadron X.)
function applyBaseDmg(dmg){
  if(dmg <= 0) return;
  state.baseHP = Math.max(0, state.baseHP - dmg);
  updateHP();
  beep(160, 140);
}

/* ─── COMBAT RESOLUTION — one correct query clears the lane ──────────────────
   Clean solve (no misses) → FATALITY detonation. Solved after misses → a full
   volley sweep. Both end the wave; `done` fires when the animation settles. */
function volleyClear(done){
  busy = true;
  successFlash();
  const svg = document.getElementById('field');
  if(!svg){ enemiesLive.forEach(en=>{ en.alive=false; en.hp=0; }); busy=false; return done(); }
  const tier = attackTier(currentPhaseSolution());
  const beamsPerTarget = Math.min(tier, 4);
  const strokeW = tier >= 4 ? 4 : 3;
  const targets = [];
  enemiesLive.forEach((en,i)=>{
    if(!en.alive) return;
    en.hp = 0;
    const p = enemyPos(i, en);
    targets.push({ i, x: p.x, y: p.y });
  });
  beep(660, 70); setTimeout(()=>beep(880,90),90);
  if(tier >= 3) setTimeout(()=>beep(1100, 110), 180);
  if(tier >= 5) setTimeout(()=>beep(1318, 130), 270);
  const STEP = 70, FLIGHT = 160;
  targets.forEach((t, idx)=>{
    const delay = idx * STEP;
    for(let b = 0; b < beamsPerTarget; b++){
      const off = (b - (beamsPerTarget-1)/2) * 12;
      setTimeout(()=>{
        const beam = document.createElementNS(SVGNS,'line');
        beam.setAttribute('x1', HELM_X + off); beam.setAttribute('y1', HELM_Y);
        beam.setAttribute('x2', t.x); beam.setAttribute('y2', t.y + off * 0.5);
        beam.setAttribute('stroke', 'var(--accent2)');
        beam.setAttribute('stroke-width', strokeW);
        beam.setAttribute('opacity','0.9');
        svg.appendChild(beam);
        setTimeout(()=>beam.remove(), FLIGHT + 40);
      }, delay + b * 18);
    }
    setTimeout(()=>{
      const node = svg.querySelector(`.enemy[data-i="${t.i}"]`);
      if(node) node.classList.add('hit');
      spawnBoom(svg, t.x, t.y);
      if(tier >= 4) spawnShockwave(svg, t.x, t.y);
      spawnDmg(svg, t.x, t.y, '✦', 'dmg-hit');
      beep(200 + Math.random()*140, 70);
    }, delay + FLIGHT);
  });
  const settle = (targets.length ? (targets.length-1)*STEP : 0) + FLIGHT + 420;
  setTimeout(()=>{
    enemiesLive.forEach(en=>{ en.alive = false; });
    if(document.getElementById('field')) drawField();
    busy = false;
    done();
  }, settle);
}

// FATALITY — a clean no-miss clear: every contact detonates in a tight stagger.
function fatality(done){
  busy = true;
  successFlash();
  const svg = document.getElementById('field');
  if(!svg){ enemiesLive.forEach(en=>{ en.alive=false; en.hp=0; }); busy=false; return done(); }
  if(state.sfx){
    const _c = audioCtx();
    [220.00, 261.63, 329.63, 440.00, 523.25].forEach((f, i)=>{
      const t = _c.currentTime + i * 0.055;
      const o = _c.createOscillator(), g = _c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.072, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.30);
      o.connect(g); g.connect(_c.destination);
      o.start(t); o.stop(t + 0.35);
    });
  }
  const tier = attackTier(currentPhaseSolution());
  const targets = [];
  enemiesLive.forEach((en,i)=>{
    if(!en.alive) return;
    en.hp = 0;
    const p = enemyPos(i, en);
    targets.push({ i, x: p.x, y: p.y });
  });
  const STEP = 50;
  targets.forEach((t, idx)=>{
    setTimeout(()=>{
      const node = svg.querySelector(`.enemy[data-i="${t.i}"]`);
      if(node) node.classList.add('hit');
      spawnBoom(svg, t.x, t.y);
      spawnShockwave(svg, t.x, t.y, '#ffd95c');
      if(tier >= 4) setTimeout(()=>spawnShockwave(svg, t.x, t.y, '#ffd95c'), 120);
      spawnDmg(svg, t.x, t.y, '⚡', 'dmg-perfect');
      beep(260 + Math.random()*260, 70);
    }, idx * STEP);
  });
  const settle = (targets.length ? (targets.length-1) * STEP : 0) + 560;
  setTimeout(()=>{
    enemiesLive.forEach(en=>{ en.alive = false; });
    if(document.getElementById('field')) drawField();
    busy = false;
    done();
  }, settle);
}

// A miss that costs the base: red flash, shake, damage number at the helm.
function missFx(dmg){
  damageFlash(); screenShake();
  if(state.sfx){
    const c = audioCtx();
    [523.25, 739.99].forEach((f, i)=>{
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = f;
      const t = c.currentTime + i * 0.006;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.055, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.20);
    });
  }
  const svg = document.getElementById('field');
  if(svg && dmg > 0) spawnDmg(svg, HELM_X, HELM_Y, '-' + dmg, 'dmg-ff');
  if(dmg > 0) applyBaseDmg(dmg);
}

// SYNTAX ERROR / BANNED VERB — a lighter clip than a bad firing solution.
function syntaxFx(){
  damageFlash(); screenShake();
  const dmg = 4;
  const svg = document.getElementById('field');
  if(svg) spawnDmg(svg, HELM_X, HELM_Y, '-' + dmg, 'dmg-ff');
  beep(150, 110);
  applyBaseDmg(dmg);
}

function updateHP(){

/* ─── COURSE COMPLETE + PLAYER PROFILE ──────────────────────────────────── */
const PROFILE_LS = 'sqlquest_profile';
function loadProfile(){
  try{ return JSON.parse(localStorage.getItem(PROFILE_LS)) || {}; }catch(e){ return {}; }
}
function saveProfile(run){
  const p = loadProfile();
  p.runs = (p.runs || 0) + 1;
  const b = p.best || {};
  if(!b.fatalities || run.fatalities > b.fatalities) b.fatalities = run.fatalities;
  if(!b.accuracy  || run.accuracy  > b.accuracy)  b.accuracy  = run.accuracy;
  if(!b.baseHP    || run.baseHP    > b.baseHP)    b.baseHP    = run.baseHP;
  if(!b.timeMs    || run.timeMs    < b.timeMs)    b.timeMs    = run.timeMs;
  if(b.visionCount === undefined || run.visionCount < b.visionCount) b.visionCount = run.visionCount;
  p.best = b; p.lastRun = run;
  localStorage.setItem(PROFILE_LS, JSON.stringify(p));
  return p;
}

function showCourseComplete(){
  const timeMs = Math.max(0, Date.now() - state.started);
  const mins = Math.floor(timeMs / 60000);
  const secs = Math.floor((timeMs % 60000) / 1000);
  const timeStr = `${mins}m ${secs < 10 ? '0' : ''}${secs}s`;
  const acc = state.attempts ? Math.round(100 * state.correct / state.attempts) : 100;
  const fat = state.fatalities || 0;
  const visionIds = Array.isArray(state.visionWaves) ? state.visionWaves : [];
  const visionCount = visionIds.length;
  const total = WAVES.length;

  const run = { fatalities: fat, accuracy: acc, baseHP: state.baseHP, timeMs, visionCount };
  const profile = saveProfile(run);
  const best = profile.best || run;
  const runs = profile.runs || 1;
  const isNewBest = runs > 1 && (
    fat  > (profile.best.fatalities || 0) ||
    acc  > (profile.best.accuracy   || 0) ||
    state.baseHP > (profile.best.baseHP  || 0)
  );

  // Rank title (celestial theme)
  const rank = fat >= 21 ? 'Grand Oracle' :
               fat >= 16 ? 'Oracle' :
               fat >= 11 ? 'Adept' :
               fat >= 5  ? 'Apprentice' : 'Initiate';

  // Next run goal — first gap
  const nextGoal =
    fat  < total  ? `Beat your clears: aim for ${Math.min(fat + 3, total)} first-try waves` :
    acc  < 95     ? `Hit 95% accuracy — tighten those filters` :
    state.baseHP < 100 ? `Finish at full HP — zero wrong guesses` :
    `Perfect run — every concept landed cold.`;

  const bar = (frac, col) =>
    `<div class="cs-bar-wrap"><div class="cs-bar" style="width:${Math.round(Math.min(1,frac)*100)}%;background:${col}"></div></div>`;

  const fmtTime = ms => {
    const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);
    return `${m}m ${s < 10 ? '0' : ''}${s}s`;
  };

  const pbBlock = runs > 1 ? `

/* ─── CODE-AS-MELODY (opt-in; requires SFX on) ──────────────────────────────

   - Tier 1: a soft pentatonic ping per keystroke (always in A-minor's orbit)
   - Tier 2: a brighter "ting" when a SQL keyword is completed at a word boundary
   - Tier 3: a pleasant chord on Execute whose richness scales with attackTier()

function keywordPrefixDepth(word){

  return 0;
}
function playMelodyType(ch){

    g.gain.exponentialRampToValueAtTime(0.042, c.currentTime + 0.003);

    const newWord = ((m && m[1]) || '') + ch;
    const depth = keywordPrefixDepth(newWord);

  }

  const isKw = scaleIdx > 0;
  const o = c.createOscillator(), g = c.createGain();
  o.type = isKw ? 'sine' : 'triangle';
  o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(isKw ? 0.048 : 0.030, c.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + (isKw ? 0.13 : 0.09));

function playMelodyBackspace(){

// ── KEYWORD CHARACTERISTIC TONES ──────────────────────────────────────────
// Every SQL keyword has its own fixed pitch in A-minor. Typing SELECT always
// lands on E4; FROM always lands on C4; WHERE on G4. A complete query becomes
// a consistent musical phrase — the same melody every time you write it.
// All pitches stay inside the same A-minor scale as the background music.
const KEYWORD_TONES = {
  // Foundations
  SELECT:   329.63,  // E4  — central, you hear it most
  FROM:     261.63,  // C4  — grounding, the base
  WHERE:    392.00,  // G4  — filtering lifts the pitch
  AND:      293.66,  // D4  — connector, stays low
  OR:       440.00,  // A4  — wider option, higher than AND
  ORDER:    523.25,  // C5  — sorting feels elevated
  BY:       293.66,  // D4  — pairs with ORDER/GROUP
  LIMIT:    587.33,  // D5  — capping: the ceiling note
  DISTINCT: 587.33,  // D5  — clean and high
  // Joining
  JOIN:     null,    // two-note: C4→G4 (two tables meeting)
  LEFT:     261.63,  // C4  — grounding (same as FROM)
  RIGHT:    261.63,  // C4
  INNER:    329.63,  // E4
  ON:       329.63,  // E4  — the link point
  // Filtering
  IN:       329.63,  // E4
  BETWEEN:  null,    // two-note spread: C4→C5 (a range = wide)
  LIKE:     392.00,  // G4  — pattern = same zone as WHERE
  IS:       293.66,  // D4
  NULL:     220.00,  // A3  — low and quiet: nothing there
  NOT:      220.00,  // A3  — low negation
  // Aggregates & grouping
  COUNT:    null,    // descending two-note: G4→C4 (rows collapsing)
  SUM:      null,    // descending two-note
  AVG:      null,    // descending two-note
  MIN:      220.00,  // A3  — the floor
  MAX:      587.33,  // D5  — the ceiling
  GROUP:    523.25,  // C5  — bucketing = elevated like ORDER
  HAVING:   440.00,  // A4  — filtering groups
  // Aliases & formatting
  AS:       261.63,  // C4  — simple rename
};

function playMelodyKeyword(kw){
  if(!state.melody || !state.sfx) return;
  const c = audioCtx();
  const tone = KEYWORD_TONES[kw];

  // JOIN / BETWEEN: two-note phrase (two concepts meeting / a range)
  if(kw === 'JOIN' || kw === 'BETWEEN'){
    const notes = kw === 'JOIN' ? [261.63, 392.00] : [261.63, 523.25];
    notes.forEach((f, i)=>{
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t0 = c.currentTime + i * 0.13;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.062, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.30);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + 0.34);
    });
    return;
  }

  // COUNT / SUM / AVG: descending two-note (rows collapsing into one number)
  if(kw === 'COUNT' || kw === 'SUM' || kw === 'AVG'){
    [392.00, 261.63].forEach((f, i)=>{
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t0 = c.currentTime + i * 0.11;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.060, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + 0.32);
    });
    return;
  }

  // Single characteristic tone (known keyword) or fallback
  const f = (tone != null) ? tone : 659.25;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.068, c.currentTime + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.32);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + 0.36);
}
function playMelodyExecute(sql){
  if(!state.melody || !state.sfx) return;
  const c = audioCtx();
  const tier = (typeof attackTier === 'function') ? attackTier(sql) : 1;
  // A-minor chord built up by tier: root → +5 → +octave → +third → +seventh
  const chord = [220.00, 329.63, 440.00, 523.25, 659.25];
  const n = Math.min(chord.length, Math.max(1, tier));
  // BPM-snap: schedule chord to the nearest 16th-note grid (70 BPM, 3.4s bar).
  // If the next grid is < 150ms away, wait for it — makes executions feel
  // "in the pocket" with the music. Otherwise fire immediately.
  const SIXTEENTH = 3.4 / 16; // ~0.2125s
  const phase = c.currentTime % SIXTEENTH;
  const toNext = SIXTEENTH - phase;
  const snapOffset = (toNext < 0.15) ? toNext : 0;
  for(let i = 0; i < n; i++){
    const t0 = c.currentTime + snapOffset + i * 0.025;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = chord[i];
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.058, t0 + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + 0.95);
  }
}

/* ─── BACKGROUND MUSIC (procedural, ~5 min through-composed) ─────────────────
   No asset files — everything is synthesised in Web Audio so it ships in one
   HTML file. Instead of a 4-bar loop, the track walks a SONG of distinct
   sections (different chord progressions, arpeggio shapes, and dynamics) that
   add up to ~5 minutes before it repeats, so it doesn't feel repetitive over a
   15–20 min session. Roadmap: extend the SONG toward ~10 min + layered texture.
   All chords stay in A-minor's orbit so the mood reads calm/focused. */
/* pad = sustained chord tones; bass = root; seventh = the soulful color tone
   (added on groove bars only, so ambient bars stay pure/calm). */
const CH = {
  Am: { pad:[220.00, 261.63, 329.63], bass:110.00, seventh:392.00 }, // +G (m7)
  F:  { pad:[174.61, 220.00, 261.63], bass:87.31,  seventh:329.63 }, // +E (maj7)
  C:  { pad:[196.00, 261.63, 329.63], bass:130.81, seventh:493.88 }, // +B (maj7)
  G:  { pad:[196.00, 246.94, 293.66], bass:98.00,  seventh:349.23 }, // +F (dom7)
  Dm: { pad:[220.00, 293.66, 349.23], bass:146.83, seventh:261.63 }, // +C (m7)
  E:  { pad:[207.65, 246.94, 329.63], bass:82.41,  seventh:293.66 }, // +D (dom7)
  Bb: { pad:[233.08, 293.66, 349.23], bass:116.54, seventh:415.30 }, // +Ab (dom7)

/* Each section: chords (one per bar), reps, and a texture style.
   arp: 'up' | 'down' | 'updown' | 'sparse' | 'none'; padGain/arpGain set the
   dynamics; bassPulse gives a section a gentle two-beat pulse. */
/* groove:true → the section gets the funk layer (syncopated bass riff, soft
   shaker/hi-hat) + 7th color. Left OFF on the intro/bridge/calm
   reprise (arp 'none'/'sparse') so those keep the pure ambient/spatial feel

const MUSIC_SONG = [
  { chords:['Am','F','C','G'],  reps:1, arp:'none',   padGain:0.045 },                            // intro — pad only (ambient)
  { chords:['Am','F','C','G'],  reps:2, arp:'up',     padGain:0.050, groove:true },               // main theme A
  { chords:['Dm','Am','Bb','F'],reps:2, arp:'down',   padGain:0.048, groove:true },               // theme B
  { chords:['F','C','E','Am'],  reps:1, arp:'sparse', padGain:0.036, bassPulse:true },            // bridge — sparse (ambient breather)
  { chords:['Am','G','F','E'],  reps:2, arp:'updown', padGain:0.050, groove:true },               // descending variation
  { chords:['Am','Am','Dm','E'],reps:2, arp:'up',     padGain:0.050, groove:true },               // drive
  { chords:['C','G','Dm','Am'], reps:2, arp:'down',   padGain:0.048, groove:true },               // theme C
  { chords:['F','G','C','Am'],  reps:2, arp:'updown', padGain:0.055, groove:true },               // lift
  { chords:['Am','F','C','G'],  reps:2, arp:'sparse', padGain:0.040 },                            // calm reprise (ambient)
  { chords:['Dm','Am','Bb','F'],reps:2, arp:'up',     padGain:0.050, groove:true },               // theme B reprise
  { chords:['Am','G','F','E'],  reps:2, arp:'updown', padGain:0.052, groove:true },               // build
  { chords:['F','C','G','Am'],  reps:2, arp:'up',     padGain:0.050, groove:true },               // resolve → top
];
let musicSchedule = null;
function buildSchedule(){
  const out = [];
  MUSIC_SONG.forEach(sec=>{
    for(let r=0; r<(sec.reps||1); r++){
      sec.chords.forEach(name=> out.push({ chord: CH[name], style: sec }));
    }
  });

}
const ARP_ORDER = { up:[0,1,2], down:[2,1,0], updown:[0,1,2,1], sparse:[0,2], none:[] };
// One-time white-noise buffer reused for the shaker/hi-hat on groove bars.
let noiseBuf = null;
function getNoiseBuf(c){
  if(noiseBuf) return noiseBuf;
  const len = Math.floor(c.sampleRate * 0.2);
  noiseBuf = c.createBuffer(1, len, c.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  return noiseBuf;
}
// A short noise tick (shaker/hi-hat), band-passed bright, soft.
function noiseTick(c, at, peak, hp){
  const src = c.createBufferSource(); src.buffer = getNoiseBuf(c);
  const bp = c.createBiquadFilter(); bp.type='highpass'; bp.frequency.value = hp||6000;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(peak, at + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
  src.connect(bp); bp.connect(g); g.connect(musicGain);
  src.start(at); src.stop(at + 0.12);

function playBar(chord, dur, style){
  style = style || {};

  const c = audioCtx(), t = c.currentTime;
  const beat = dur / 4; // 4 beats per bar
  // pad — slow swell and fade
  chord.pad.forEach(f=>{
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(padPk, t + 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.1);
  });

  if(groove && chord.seventh){

    so.type = 'sine'; so.frequency.value = chord.seventh;
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(padPk * 0.55, t + 1.1);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    so.connect(sg); sg.connect(musicGain); so.start(t); so.stop(t + dur + 0.1);
  }
  if(!groove){
    // ── AMBIENT BAR ── soft root, sustained or a gentle two-beat pulse
    const bassHits = style.bassPulse ? [0, dur/2] : [0];
    bassHits.forEach(off=>{
      const bo = c.createOscillator(), bg = c.createGain();
      bo.type = 'triangle'; bo.frequency.value = chord.bass;
      const bt = t + off, blen = style.bassPulse ? dur/2 : dur;
      bg.gain.setValueAtTime(0.0001, bt);
      bg.gain.exponentialRampToValueAtTime(0.07, bt + 0.25);
      bg.gain.exponentialRampToValueAtTime(0.0001, bt + blen);

    });

    // shaker. Tempo stays laid-back (~70 BPM) so it reads
    // funky-but-mellow, not frantic — preserving the calm/spatial feel.
    // Groove bass: steady two-beat root pulse (beats 1 + 3) — no pitch jumps
    // to the fifth or octave, so it stays rhythmic without forming a melody.
    [0, beat * 2].forEach(off => {
      const bo = c.createOscillator(), bg = c.createGain();
      bo.type = 'triangle'; bo.frequency.value = chord.bass;
      const bt = t + off;
      bg.gain.setValueAtTime(0.0001, bt);
      bg.gain.exponentialRampToValueAtTime(0.082, bt + 0.02);
      bg.gain.exponentialRampToValueAtTime(0.0001, bt + beat * 0.85);
      bo.connect(bg); bg.connect(musicGain); bo.start(bt); bo.stop(bt + beat + 0.05);
    });
    // (Removed the off-beat square "clav stab" — its chiptune timbre read too
    //  video-gamish and grew fatiguing over a long session. The triangle bass +
    //  shaker carry the funk pocket without the harsh square edge.)
    // Shaker / hi-hat: steady eighth-note pulse, accented off-beats.
    for(let i=0;i<8;i++){
      const off = i * (beat/2);
      const accent = (i % 2 === 1); // off-beats brighter (funk feel)
      noiseTick(c, t + off, accent ? 0.020 : 0.011, accent ? 7000 : 5500);
    }
  }
  // Arpeggios removed — the typing melody IS the melodic layer now.
  // Music stays as a clean harmonic bed (pad + bass + groove shaker).
}
function startMusic(){
  if(!state.music || musicTimer) return;
  const c = audioCtx();
  if(!musicGain){ musicGain = c.createGain(); musicGain.gain.value = 0.9; musicGain.connect(c.destination); }
  if(!musicSchedule) musicSchedule = buildSchedule();
  const BAR = 3.4;
  const tick = ()=>{ const b = musicSchedule[musicStep % musicSchedule.length]; playBar(b.chord, BAR, b.style); musicStep++; };
  tick();
  musicTimer = setInterval(tick, BAR * 1000);
}
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer = null; } }

// The Prism ghost underlay: the textarea's text is transparent; the ghost shows

function wireEditor(){
  const ed = document.getElementById('editor');

  ed.addEventListener('keydown', e => {

    } else if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){

    } else if(e.key === 'Backspace'){
      playMelodyBackspace();
    } else if(e.key && e.key.length === 1){
      playMelodyType(e.key);
      if(' ;,().'.includes(e.key)){
        const m = (ed.value || '').match(/(\w+)\s*$/);
        if(m && SQL_KEYWORDS.includes(m[1].toUpperCase())){
