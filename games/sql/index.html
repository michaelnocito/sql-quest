// Pre-fill ~half of the solution into the editor, cut at a word boundary.
function fillHalf(){
  const answer = currentPhaseSolution();
  const toks = answer.split(/\s+/);
  const target = answer.length * 0.5;
  let acc = '', i = 0;
  while(i < toks.length - 1 && acc.length < target){ acc += (acc ? ' ' : '') + toks[i]; i++; }
  if(!acc) acc = toks[0] || '';
  const ed = document.getElementById('editor');
  if(ed){ ed.value = acc + ' '; syncGhost(); ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
}

// Diagnostic coaching (ported from Trail's whatsOff): name WHAT is off — never
// flavor alone. Shape, order, too many rows (friendly fire), or too few.
function whatsOff(r){
  if(r.reason === 'sql-error'){
    const col = /no such column: ?([\w.]+)/i.exec(r.error || '');
    if(col) return `There's no column called <b>${esc(col[1])}</b> — check the schema strip for the real names.`;
    const tbl = /no such table: ?([\w.]+)/i.exec(r.error || '');
    if(tbl) return `There's no table called <b>${esc(tbl[1])}</b> — this wave's tables are listed in the schema strip.`;
    return `Syntax error — check spelling and punctuation. (${esc(r.error || 'query failed')})`;
  }
  if(r.reason === 'banned')
    return `Only read queries fire from this console (SELECT, WHERE, JOIN…) — no table changes mid-battle.`;
  const p = r.player || { columns: [], rows: [] };
  const e = r.expected || { columns: [], rows: [] };
  if(r.reason === 'wrong-shape')
    return `Shape check: the firing solution wants <b>${e.columns.length}</b> column${e.columns.length===1?'':'s'} (${e.columns.map(esc).join(', ')}) — yours returned <b>${p.columns.length}</b>${p.columns.length ? ` (${p.columns.map(esc).join(', ')})` : ''}.`;
  if(r.reason === 'wrong-order')
    return `Right targets, wrong order — check your ORDER BY (and whether it should be DESC).`;
  if(p.rows.length > e.rows.length){
    const fp = falsePositives(p, e);
    return `Too broad — you're hitting allied scouts${fp ? ` (${fp} stray row${fp===1?'':'s'})` : ''}. Yours returned <b>${p.rows.length}</b>, the solution wants <b>${e.rows.length}</b>. Tighten the WHERE.`;
  }
  if(p.rows.length < e.rows.length)
    return `Too few — yours returned <b>${p.rows.length}</b>, the solution wants <b>${e.rows.length}</b>. A filter is dropping targets it shouldn't.`;
  return `Same row count, different rows — compare your values against the lane.`;
}

// Results/Messages tabs — "(N rows returned in X ms)". Reading output is a skill.
function queryOutput(r, execMs){
  const messages = [];
  if(r.reason === 'sql-error' || r.reason === 'banned'){
    messages.push(`<div class="msgline err">Error: ${esc(r.error || 'query rejected')}</div>`);
  } else {
    const n = r.player ? r.player.rows.length : 0;
    messages.push(`<div class="msgline">(${n} row${n===1?'':'s'} returned in ${execMs} ms)</div>`);
  }
  const hasGrid = r.player && r.player.columns.length;
  const results = hasGrid ? renderRows(r.player) : '<div class="msgline dim">No result set.</div>';
  const startTab = (r.reason === 'sql-error' || r.reason === 'banned') ? 'msg' : 'res';
  const uid = 'out' + Date.now();
  return `
    <div class="outtabs">
      <button id="${uid}-tres" class="${startTab==='res'?'on':''}" onclick="showOutTab('${uid}','res')">Results</button>
      <button id="${uid}-tmsg" class="${startTab==='msg'?'on':''}" onclick="showOutTab('${uid}','msg')">Messages</button>
    </div>
    <div id="${uid}-res" class="outpane" style="display:${startTab==='res'?'block':'none'}">${results}</div>
    <div id="${uid}-msg" class="outpane" style="display:${startTab==='msg'?'block':'none'}">${messages.join('')}</div>`;
}
function showOutTab(uid, tab){
  for(const t of ['res','msg']){
    document.getElementById(`${uid}-${t}`).style.display = t === tab ? 'block' : 'none';
    document.getElementById(`${uid}-t${t}`).classList.toggle('on', t === tab);
  }
}
function renderRows(res){
  const gi = gaugeColIndex(res.columns);
  const gMax = gi >= 0 ? Math.max(...res.rows.map(row => Number(row[gi])).filter(n => !isNaN(n)), 0) : 0;
  const thead = `<tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
  const tbody = res.rows.slice(0, 60).map(row=>`<tr>${row.map((v,ci)=>
    ci === gi ? gaugeCell(v, gMax) : `<td>${v==null?'NULL':esc(v)}</td>`
  ).join('')}</tr>`).join('');
  return `<table class="result-tbl"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
}

function helplineHtml(diag, subline){
  return `<div class="helpline"><b>${esc(pick(MISS_LINES))}</b>${diag ? `<br>🧭 ${diag}` : ''}${subline ? `<br><span class="dim">${subline}</span>` : ''}</div>`;
}

// A miss: escalate Trail-style. Returns the helper subline for the helpline.
function applyMissAssist(kind){
  waveTries++; waveFriction = true;
  const pp = document.getElementById('trypips'); if(pp) pp.innerHTML = pipsHtml();
  let sub;
  if(waveTries === 1){
    if(kind === 'syntax') syntaxFx(); // lighter clip, even on the "free" miss
    sub = `First slip's on the house, Chief. Fix your query and fire again.`;
  } else if(waveTries === 2){
    kind === 'syntax' ? syntaxFx() : missFx(10);
    fillHalf();
    sub = `That one cost the base${kind==='syntax' ? ' a scrape' : ' (−10 integrity)'}. I dropped the first half of the solution into your console — finish the tail and fire.`;
  } else {
    kind === 'syntax' ? syntaxFx() : missFx(18);
    handedOver = true;
    const wid = currentWave().id;
    if(!Array.isArray(state.visionWaves)) state.visionWaves = [];
    if(state.visionWaves.indexOf(wid) === -1) state.visionWaves.push(wid);
    const ed = document.getElementById('editor');
    if(ed){ ed.value = currentPhaseSolution(); syncGhost(); ed.focus(); }
    sub = `👁 <b>Oracle's Vision</b> — the full solution is in your console${kind==='syntax' ? '' : ' (−18 integrity)'}. Read it, press Execute, and watch what it does.`;
  }
  save();
  if(state.baseHP <= 0){ screenLost(); return null; }
  return sub;
}

function submitAnswer(){
  if(busy || !SQLjs) return;
  const w = currentWave();
  const ed = document.getElementById('editor');
  const sql = (ed ? ed.value : '').trim();
  const out = document.getElementById('result');
  if(!sql){ setFb('warn', 'Write a query first, then hit Execute — an empty run doesn\'t cost a pip.'); return; }

  // Banned verbs — a lighter hit, but it still counts as a run.
  if(!isSafe(sql)){
    const r = { reason: 'banned', error: 'write/DDL verbs are locked — read-only console' };
    const sub = applyMissAssist('syntax');
    if(sub === null) return;
    if(out) out.innerHTML = queryOutput(r, 1) + helplineHtml(whatsOff(r), sub);
    return;
  }

  state.attempts++;
  let player, expected, execMs;
  const db = freshDB(w.schema);
  try{
    const t0 = performance.now();
    player = execQuery(db, sql);
    execMs = Math.max(1, Math.round(performance.now() - t0));
    expected = execQuery(db, currentPhaseSolution());
  }catch(e){
    db.close();
    const r = { reason: 'sql-error', error: e.message };
    const sub = applyMissAssist('syntax');
    if(sub === null) return;
    if(out) out.innerHTML = queryOutput(r, 1) + helplineHtml(whatsOff(r), sub);
    save();
    return;
  }
  db.close();

  playMelodyExecute(sql);
  const ordered = solutionIsOrdered(currentPhaseSolution());
  if(sameResult(player, expected, ordered)){
    state.correct++;
    const clean = !waveFriction;
    const hasNextPhase = !!(w.phases && state.phase < w.phases.length - 1);
    if(out) out.innerHTML = queryOutput({ reason: 'ok', player, expected }, execMs);
    setFb('ok', hasNextPhase ? '⚡ Shields fractured — phase 2 loading…' : (clean ? '⚡ FATALITY — flawless execution.' : '✓ Firing solution locked. Volley away.'));
    save();
    const after = hasNextPhase ? nextPhase : ()=>waveCleared(clean);
    clean ? fatality(after) : volleyClear(after);
    return;
  }

  // Wrong result set.
  const sameCols = player.columns.length === expected.columns.length &&
    player.columns.every((c,i)=> String(c).toLowerCase() === String(expected.columns[i]).toLowerCase());
  let reason = 'wrong-rows';
  if(!sameCols) reason = 'wrong-shape';
  else if(ordered && sameResult(player, expected, false)) reason = 'wrong-order';
  const r = { reason, player, expected };
  const sub = applyMissAssist('miss');
  if(sub === null) return;
  if(out) out.innerHTML = queryOutput(r, execMs) + helplineHtml(whatsOff(r), sub);
  setFb('warn', esc('Wrong lock — see the diagnostic below the results.'));
  save();
}

/* ─── PHASES (boss waves 22/23) ──────────────────────────────────────────── */
function nextPhase(){
  state.phase++;
  waveTries = 0; handedOver = false;   // waveFriction persists — fatality means the WHOLE wave clean
  prepareWave();
  screenTask(false);
  showToast('⚡ SHIELDS DOWN — Phase ' + (state.phase + 1));
  setFb('ok', '⚡ Shields fractured — <b style="color:var(--yellow)">Phase ' + (state.phase + 1) + ' begins.</b> New firing solution above.');
  beep(523,70); setTimeout(()=>beep(659,80),80); setTimeout(()=>beep(784,100),170);
}

/* 5 — DEBRIEF */
function waveCleared(clean){
  const w = currentWave();
  const wasVision = handedOver;
  if(clean) state.fatalities = (state.fatalities || 0) + 1;
  state.streak = clean ? (state.streak || 0) + 1 : 0;
  if(!state.cleared.includes(w.id)) state.cleared.push(w.id);
  state.phase = 0;
  save();
  celebrate();
  if(state.wave >= WAVES.length - 1){
    setTimeout(showCourseComplete, 900);
    return;
  }
  screenDebrief(clean, wasVision);
  maybeBreak();
}

function screenDebrief(clean, wasVision){
  state.screen = 'debrief';
  const w = currentWave();
  const next = WAVES[state.wave + 1];
  const banner = clean ? FATALITY_BANNER : pick(WIN_BANNERS);
  const flavor = wasVision
    ? `You channeled the Vision and typed it through — <b>${esc(w.concept)}</b> is yours now. Next time, try it cold.`
    : esc(pick(WIN_LINES));
  const terms = (w.terms && w.terms.length)
    ? `<div class="terms-wrap" style="justify-content:flex-start"><div class="terms-label">Terms unlocked</div>${w.terms.map(t=>`<span class="term-chip">${esc(t)}</span>`).join('')}</div>` : '';
  const streakChip = (state.streak || 0) >= 2
    ? `<p><span class="badge" style="color:var(--yellow);font-size:12px">🔥 ${state.streak} flawless waves running!</span></p>` : '';
  app.innerHTML = `
    ${statbar()}
    <div class="winbanner">${banner}</div>
    <p class="debrief-flavor">${flavor}</p>
    <div class="panel">
      ${clean ? `<p><span class="badge" style="color:var(--yellow)">⚡ FATALITY — first-try, no assists</span></p>` : ''}
      ${streakChip}
      <p>Sector ${w.id} cleared — <b style="color:var(--accent2)">${esc(w.concept)}</b> locked in. Campaign accuracy: <b class="amber">${accuracy()}%</b>.</p>
      ${terms}
      <p class="dim" style="margin-top:8px">Next up — Sector ${next.id}: <b style="color:var(--text)">${esc(next.concept)}</b> · ${esc(next.title)}</p>
    </div>
    <div class="btnrow">
      <button class="btn btn-primary" onclick="advanceWave()">Next sector ▸</button>
      <button class="btn btn-ghost" onclick="screenMap()">🗺 Sector chart</button>
    </div>`;
}

function advanceWave(){
  state.wave = Math.min(state.wave + 1, WAVES.length - 1);
  state.phase = 0;
  save();
  screenStory();
}

/* LOSS */
function screenLost(){
  state.screen = 'lost';
  app.innerHTML = `
    ${statbar()}
    <div class="winbanner" style="color:var(--red);text-shadow:0 0 18px rgba(224,92,92,.5)">BASE OVERRUN</div>
    <p class="debrief-flavor">The swarm broke through. Every analyst debugs — patch the hull and run it again.</p>
    <div class="panel"><p>Base integrity restores to full. Same sector, same firing solution — you've seen its shape now.</p></div>
    <div class="btnrow"><button class="btn btn-primary" onclick="retryWave()">↻ Retry Sector ${currentWave().id}</button></div>`;
}
function retryWave(){
  state.baseHP = 100; state.phase = 0;
  save();
  screenStory();
}

/* ─── DEV MODE + SETTINGS ────────────────────────────────────────────────── */
function toggleDev(){
  state.devMode = !state.devMode;
  document.getElementById('dev-btn').classList.toggle('on', state.devMode);
  document.getElementById('dev-jump').style.display = state.devMode ? 'inline-block' : 'none';
  const hint = document.getElementById('dev-hint');
  if(hint) hint.style.visibility = state.devMode ? 'visible' : 'hidden';
  save();
}
function populateDevJump(){
  const sel = document.getElementById('dev-jump');
  sel.innerHTML = WAVES.map((w,i) => `<option value="${i}">${w.id}. ${w.concept}</option>`).join('');
  sel.value = String(state.wave);
}
function jumpToWave(idx){
  const n = Number(idx);
  if(!Number.isInteger(n) || n < 0 || n >= WAVES.length) return;
  state.wave = n; state.phase = 0;
  state.baseHP = 100;
  save();
  screenStory();
}
function resetCampaign(){
  state.wave = 0; state.phase = 0;
  state.baseHP = 100;
  state.cleared = [];
  state.attempts = 0; state.correct = 0; state.streak = 0;
  state.fatalities = 0; state.visionWaves = [];
  state.started = Date.now();
  save();
  state.begun ? screenMap() : screenTitle();
}
function confirmReset(){
  if(confirm('Reset ALL campaign progress and start from Sector 1?')) { state.begun = true; resetCampaign(); }
}

/* ─── AUDIO SUSPEND / RESUME (page visibility) ───────────────────────────── */
function suspendAudio(){ stopMusic(); if(actx && actx.state === 'running') actx.suspend(); }
function resumeAudioIfActive(){
  if(state.screen === 'title') return;
  if(actx) actx.resume();
  if(state.music) startMusic();
}
document.addEventListener('visibilitychange', ()=>{ document.hidden ? suspendAudio() : resumeAudioIfActive(); });
window.addEventListener('pagehide', suspendAudio);

/* ─── INIT ───────────────────────────────────────────────────────────────── */
async function init(){
  load();
  applyTheme();
  updateAudioBtns();
  document.getElementById('dev-btn').classList.toggle('on', state.devMode);
  populateDevJump();
  document.getElementById('dev-jump').style.display = state.devMode ? 'inline-block' : 'none';
  if(state.wave >= WAVES.length) state.wave = 0;
  try{
    await bootSQL();
  }catch(e){
    app.innerHTML = '<div class="panel"><p class="amber">Could not load the SQL engine. Check your connection and reload.</p></div>';
    return;
  }
  screenTitle();
}
init();
</script>
